<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Investor Event Outcomes</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq-light: #86b6ef; --seq-mid: #3987e5; --s4: #eda100;
  --ord-1: #86b6ef; --ord-2: #3987e5; --ord-3: #1c5cab; --ord-4: #0d366b;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --crit-text: #b42727; --warning: #fab219;
  --accent-wash: rgba(42,120,214,0.08); --link: #1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq-light: #1c5cab; --seq-mid: #6da7ec; --s4: #c98500;
    --ord-1: #1c5cab; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
    --good-text: #0ca30c; --crit-text: #e66767; --accent-wash: rgba(57,135,229,0.12); --link: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq-light: #1c5cab; --seq-mid: #6da7ec; --s4: #c98500;
  --ord-1: #1c5cab; --ord-2: #2a78d6; --ord-3: #6da7ec; --ord-4: #b7d3f6;
  --good-text: #0ca30c; --crit-text: #e66767; --accent-wash: rgba(57,135,229,0.12); --link: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 19px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.asof { color: var(--muted); font-size: 12px; }
button.theme { background: none; border: 1px solid var(--ring); color: var(--ink-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; margin: 18px 0 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.filters select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; min-width: 110px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: 0; background: var(--surface); color: var(--ink-2); padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.reset { margin-left: auto; font: inherit; font-size: 12px; background: none; border: 0; color: var(--link); cursor: pointer; padding: 6px 0; }
.nondefault { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 6px 10px; margin: 0 0 12px; }

nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin: 6px 0 22px; overflow-x: auto; }
nav.tabs button { font: inherit; font-weight: 550; background: none; border: 0; color: var(--ink-2); padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button .q { color: var(--muted); font-weight: 500; margin-right: 4px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.lede { margin: 0 0 18px; } .lede p { color: var(--ink-2); margin: 4px 0 0; max-width: 820px; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.mt { margin-top: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
.card .cap { margin: 0 0 12px; color: var(--ink-2); font-size: 12.5px; }
.card .sowhat { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--grid); font-size: 13px; color: var(--ink); }
.card .sowhat b { font-weight: 650; }
.tile .lbl { color: var(--ink-2); font-size: 12.5px; }
.tile .val { font-size: 26px; font-weight: 620; margin-top: 2px; letter-spacing: -0.01em; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }

.answer { display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.answer .num { width: 36px; height: 36px; border-radius: 99px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 650; }
.answer .q { color: var(--ink-2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.answer .a { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 2px 0 6px; }
.answer .body { color: var(--ink-2); max-width: 760px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 10px 0 6px; }
.fact .v { font-size: 20px; font-weight: 650; } .fact .k { font-size: 12px; color: var(--ink-2); }
.goto { font: inherit; font-size: 13px; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 550; }
.recs { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: r; }
.recs li { counter-increment: r; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px; background: var(--surface-2); border-radius: 8px; }
.recs li::before { content: counter(r); width: 24px; height: 24px; border-radius: 6px; background: var(--accent-wash); color: var(--link); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.recs b { display: block; } .recs .why { color: var(--ink-2); font-size: 13px; margin-top: 2px; } .recs .kpi { color: var(--muted); font-size: 12px; margin-top: 4px; }

.verdict { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.v-yes { background: rgba(12,163,12,.12); color: var(--good-text); }
.v-no { background: rgba(208,59,59,.12); color: var(--crit-text); }
.v-mixed { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--axis); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 550; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.best { font-weight: 700; } td.best::after { content: " ●"; color: var(--good); font-size: 9px; vertical-align: 2px; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--accent-wash); }
tbody tr.sel { background: var(--accent-wash); box-shadow: inset 3px 0 0 var(--s1); }
.tscroll { max-height: 440px; overflow: auto; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--axis); color: var(--ink-2); margin: 1px 3px 1px 0; white-space: nowrap; }
.sev-High { color: var(--crit-text); font-weight: 600; } .sev-Medium { color: var(--ink); font-weight: 600; } .sev-Low { color: var(--muted); }
input.search { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; max-width: 260px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; background: var(--accent-wash); color: var(--ink); border-radius: 99px; padding: 4px 6px 4px 12px; }
.chip button { border: 0; background: var(--surface); color: var(--ink-2); border-radius: 99px; width: 22px; height: 22px; cursor: pointer; font-size: 13px; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }

.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.term:focus { outline: 2px solid var(--s1); outline-offset: 1px; border-radius: 2px; }
.numlink { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 3px; font-variant-numeric: tabular-nums; }
.numlink:hover { text-decoration-color: var(--link); }

svg text { font-family: inherit; }
.axis-text { fill: var(--muted); font-size: 11px; }
.lbl-text { fill: var(--ink-2); font-size: 12px; }
.val-text { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; }
.mark { transition: opacity .12s; } .mark:hover, .mark:focus { opacity: .78; outline: none; }
.hb { display: grid; gap: 8px; }
.hb-row { display: grid; grid-template-columns: minmax(96px, 32%) 1fr; align-items: center; gap: 10px; }
.hb-lbl { color: var(--ink-2); font-size: 12.5px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-track { display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--axis); padding: 3px 0; min-height: 26px; }
.hb-bar { height: 18px; border-radius: 0 4px 4px 0; flex: none; max-width: calc(100% - 96px); }
.hb-val { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-suf { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
.funnels { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.fn h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: flex-start; min-height: 2.9em; line-height: 1.4; }
.fn h4 .swatch { margin-top: 4px; flex: none; }
.fn-row { display: grid; grid-template-columns: 1fr; margin-bottom: 4px; }
.fn-bar { margin: 0 auto; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; min-width: 2px; }
.fn-lbl { text-align: center; font-size: 11.5px; color: var(--ink-2); margin: 1px 0 3px; }
.fn-out { text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.evstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 0 0 18px; }
.evstrip .ev { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; }
.evstrip .swatch { margin-top: 5px; }
tfoot td { font-weight: 650; border-top: 1px solid var(--axis); border-bottom: 0; background: var(--surface-2); position: sticky; bottom: 0; }
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 8px; align-items: stretch; }
.flow .col { display: grid; gap: 8px; align-content: start; }
.flow .h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.flow .bx { border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); font-size: 12.5px; }
.flow .bx b { display: block; font-size: 13px; } .flow .bx span { color: var(--ink-2); }
.flow .bx.out { background: var(--accent-wash); border-color: var(--s1); }
.flow .arrow { align-self: center; color: var(--muted); font-size: 18px; }
@media (max-width: 720px) { .flow { grid-template-columns: 1fr; } .flow .arrow { transform: rotate(90deg); justify-self: center; } }
.pri { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; }
.pri-1 { background: rgba(208,59,59,.12); color: var(--crit-text); } .pri-2 { background: var(--accent-wash); color: var(--link); } .pri-3 { background: var(--surface-2); color: var(--muted); }
details.tl summary { cursor: pointer; color: var(--link); font-weight: 550; font-size: 13px; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); box-shadow: 0 4px 16px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 300px; display: none; }
#tip .v { font-weight: 650; font-size: 13px; } #tip .k { color: var(--ink-2); } #tip .d { color: var(--ink-2); margin-top: 2px; }
.methods p, .methods li { color: var(--ink-2); }
.methods dl { display: grid; grid-template-columns: minmax(140px, 210px) 1fr; gap: 8px 16px; margin: 0; }
.methods dt { font-weight: 600; } .methods dd { margin: 0; color: var(--ink-2); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
@media (max-width: 640px) { .methods dl { grid-template-columns: 1fr; } .answer { grid-template-columns: 1fr; } .answer .num { display: none; } }
</style>
</head>

  cpx: ["Cost per extra firm met", "Event cost divided by the EXTRA attending firms we met: firms met within {w} days after the event minus firms met in the {w} days before. It removes firms we would have met anyway. Lower is better; an event that met no more firms after than before has no value."],
  cpxs: ["Cost per firm the event added", "Event cost divided by the extra attending firms the event added. Extra firms = attending firms met in the {w} days after the event minus those met in the {w} days before. From that we take away the rise that firms not at the event also saw over the same weeks (it would have happened anyway): attending firms × the change in the share of those firms we met. Needs at least 5 firms not at the event to compare with. Lower is better; an event that added no firms has no value here."],
